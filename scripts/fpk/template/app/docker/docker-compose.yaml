name: stundeck-fpk

services:
  stundeck:
    image: {{IMAGE_REPOSITORY}}:{{IMAGE_TAG}}
    container_name: stundeck-fpk
    network_mode: host
    restart: unless-stopped
    read_only: true
    user: "${TRIM_UID}:${TRIM_GID}"
    entrypoint:
      - /bin/sh
      - /stundeck-fpk-entrypoint.sh
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      HOME: /var/lib/stundeck
      STUNDECK_DATA_DIR: /var/lib/stundeck/data
      STUNDECK_DATABASE: /var/lib/stundeck/data/stundeck.db
      STUNDECK_MASTER_KEY_FILE: /var/lib/stundeck/data/master.key
      STUNDECK_NATMAP_BINARY: /usr/local/bin/natmap
      STUNDECK_NOTIFY_BINARY: /usr/local/bin/stundeck-notify
      STUNDECK_FPK_CONFIG_DIR: /etc/stundeck
      STUNDECK_FPK_REQUESTED_PORT: "${wizard_port:-}"
      STUNDECK_SECURE_COOKIES: "${wizard_secure_cookies:-false}"
      TZ: "${wizard_timezone:-Asia/Shanghai}"
    volumes:
      - type: bind
        source: ${TRIM_APPDEST}/docker/entrypoint.sh
        target: /stundeck-fpk-entrypoint.sh
        read_only: true
      - type: bind
        source: ${TRIM_PKGETC}
        target: /etc/stundeck
      - type: bind
        source: ${TRIM_PKGVAR}
        target: /var/lib/stundeck
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD-SHELL
        - 'port=$$(cat /etc/stundeck/stundeck.port) && STUNDECK_LISTEN="127.0.0.1:$$port" stundeck healthcheck'
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
