name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dashboard dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Typecheck and build dashboard
        run: pnpm --dir web run build
      - name: Test backend
        run: go test -race ./...
      - name: Test dashboard and Worker proxy
        run: |
          pnpm --dir web test
          node --test internal/cloudflare/worker_proxy.test.mjs
      - name: Verify formatting
        run: test -z "$(git ls-files '*.go' | xargs gofmt -l)"
      - name: Check committed files for credential patterns
        run: bash scripts/check-no-secrets.sh

  docker:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: stundeck:ci
          platforms: linux/amd64
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
