name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/stundeck
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fpk:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified fnpack
        run: |
          curl -fsSL --retry 3 \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 \
            -o "$RUNNER_TEMP/fnpack"
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  $RUNNER_TEMP/fnpack" \
            | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/fnpack"
      - name: Build fnOS FPK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          FNPACK_BIN: ${{ runner.temp }}/fnpack
        run: |
          release_version="${RELEASE_TAG#v}"
          FPK_VERSION="$release_version" \
          FPK_IMAGE_TAG="$RELEASE_TAG" \
          FPK_SKIP_IMAGE_CHECK=1 \
          bash scripts/fpk/build-fpk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stundeck-fpk-${{ github.ref_name }}
          path: dist-fpk/*.fpk
          if-no-files-found: error
