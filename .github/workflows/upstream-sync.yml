name: Upstream Sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 强制合并上游
        id: merge
        run: |
          git remote add upstream https://github.com/Nciae-Zyh/stundeck.git
          git fetch upstream

          before="$(git rev-parse HEAD)"
          upstream_head="$(git rev-parse upstream/main)"

          if ! git merge -X theirs upstream/main --no-edit \
            -m "chore(sync): 强制合并 Nciae-Zyh/stundeck@${upstream_head:0:7}"; then
            # -X theirs 只能自动解决文件内容冲突，处理不了"上游删除、fork 修改"
            # 这类删除冲突（web/dist 下带哈希的文件名每次构建都变，是重灾区）。
            # 强制合并语义：残留冲突一律以上游为准。
            git diff -z --name-only --diff-filter=U | while IFS= read -r -d '' f; do
              if git cat-file -e "upstream/main:$f" 2>/dev/null; then
                git checkout --theirs -- "$f"
                git add "$f"
              else
                git rm "$f"
              fi
            done
            git commit --no-edit
          fi

          if [ "$before" = "$(git rev-parse HEAD)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 同步失败时创建 Issue
        if: failure() && steps.merge.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Upstream sync failed — manual merge needed',
              body: '自动同步上游 `Nciae-Zyh/stundeck` 失败，请本地处理。\n\nRun: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            });
