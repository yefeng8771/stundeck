name: Upstream Sync

on:
  schedule:
    # 每天 UTC 02:00 自动同步上游
    - cron: '0 2 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write # 推送 merge 结果到 main
  issues: write   # 同步失败时创建 issue 提醒

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/main
        id: merge
        run: |
          git remote add upstream https://github.com/Nciae-Zyh/stundeck.git
          git fetch upstream
          git merge upstream/main --no-edit

      - name: Push
        if: success()
        run: git push origin main

      - name: Open issue on conflict / failure
        if: failure() && steps.merge.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Upstream sync failed — manual merge needed',
              body: [
                '自动同步上游 `Nciae-Zyh/stundeck` 失败，通常是 `web/dist` 构建产物或源码发生冲突。',
                '',
                '请本地处理：',
                '```',
                'git fetch upstream',
                'git merge upstream/main',
                '# 若 web/dist 冲突：git rm -r web/dist && pnpm --dir web build && git add web/dist',
                '# 源码冲突按需手动解决',
                'git push origin main',
                '```',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join('\n')
            });
