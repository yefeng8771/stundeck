name: Build apk (IPQ60XX)

on:
  workflow_dispatch:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SDK_BASE: https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq60xx

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build dashboard
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run build

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Cross-compile aarch64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          set -eu
          VER="0.1.$(date -u +%Y%m%d%H%M)"
          echo "STUNDECK_VERSION=$VER" >> "$GITHUB_ENV"
          M=github.com/Nciae-Zyh/stundeck/internal/version
          mkdir -p prebuilt
          go build -trimpath \
            -ldflags "-s -w -X $M.Version=$VER -X $M.Commit=${GITHUB_SHA::7}" \
            -o prebuilt/stundeck ./cmd/stundeck
          go build -trimpath -ldflags "-s -w" \
            -o prebuilt/stundeck-notify ./cmd/stundeck-notify
          file prebuilt/stundeck

      - name: Host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libncurses-dev \
            zlib1g-dev gawk gettext libssl-dev xsltproc rsync unzip \
            python3 zstd file

      - name: Fetch SDK
        run: |
          set -eu
          NAME=$(curl -fsSL "$SDK_BASE/sha256sums" \
            | grep -oE '[a-z]+-sdk-[^ ]+\.tar\.zst' | head -n1)
          echo "SDK: $NAME"
          curl -fsSL -o sdk.tar.zst "$SDK_BASE/$NAME"
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          rm sdk.tar.zst

      - name: Stage package
        run: |
          cp -r openwrt/stundeck sdk/package/stundeck
          mkdir -p sdk/prebuilt
          cp prebuilt/stundeck prebuilt/stundeck-notify sdk/prebuilt/

      - name: Build apk
        working-directory: sdk
        run: |
          set -eu
          ./scripts/feeds update -a
          ./scripts/feeds install natmap
          export STUNDECK_BIN_DIR="$PWD/prebuilt"
          echo 'CONFIG_PACKAGE_stundeck=y' >> .config
          make defconfig
          make package/stundeck/compile V=s -j$(nproc)

      - name: Collect
        run: |
          mkdir -p dist
          find sdk/bin -name 'stundeck*.apk' -exec cp {} dist/ \;
          # Raw static aarch64 binaries (CGO_ENABLED=0) for downstream firmware
          # integrators that inject via release download (sing-box-style) instead of apk.
          tar -czf "dist/stundeck-${STUNDECK_VERSION}-linux-arm64.tar.gz" -C prebuilt stundeck stundeck-notify
          ls -lh dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="v$STUNDECK_VERSION"
          NOTES="Auto-built IPQ60XX apk + raw linux-arm64 binary tarball from commit ${GITHUB_SHA:0:7}, version $STUNDECK_VERSION, built $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          gh release create "$TAG" dist/*.apk dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "Stundeck IPQ60XX apk $TAG" --notes "$NOTES"
